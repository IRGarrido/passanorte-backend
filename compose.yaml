# S1: separate service processes; seven legacy databases until S2 migration.
x-environment: &environment
  APP_ENV: ${APP_ENV:-production}
  RABBITMQ_URL_FILE: /run/secrets/rabbit_url
  JWT_PUBLIC_KEYS_DIR: /run/public-keys
  JWT_ISSUER: ${JWT_ISSUER:-passanorte}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-passanorte-api}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  CATALOG_SERVICE_URL: http://catalog:8002
  VALIDATION_SERVICE_URL: http://validation:8003

x-service: &service
  build: {context: ., target: runtime}
  restart: unless-stopped
  init: true
  volumes:
    - ${SECRETS_DIR:-./secrets}/public:/run/public-keys:ro
  depends_on:
    db: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    restart: unless-stopped
    environment:
      POSTGRES_USER: passanorte
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "passanorte"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec", "export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbit_password); exec docker-entrypoint.sh rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: passanorte
    secrets: [rabbit_password]
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: ., target: runtime}
    command: ["bash", "scripts/apply_migrations.sh"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL_TEMPLATE_FILE: /run/secrets/database_template
      RABBITMQ_URL_FILE: /run/secrets/rabbit_url
    secrets: [database_template, rabbit_url]
    depends_on:
      db: {condition: service_healthy}

  seed:
    build: {context: ., target: runtime}
    command: ["python", "scripts/create_admin.py", "--if-missing", "--email", "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL_FILE: /run/secrets/database_auth
      RABBITMQ_URL_FILE: /run/secrets/rabbit_url
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [database_auth, rabbit_url, admin_password]
    depends_on:
      migrate: {condition: service_completed_successfully}

  auth:
    <<: *service
    command: ["uvicorn", "services.auth.app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_auth
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?Set JWT_ACTIVE_KID}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii
      PII_HMAC_KEY_FILE: /run/secrets/pii_hmac
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
    secrets: [database_auth, rabbit_url, jwt_private, pii, pii_hmac]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  catalog:
    <<: *service
    command: ["uvicorn", "services.catalog.app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["127.0.0.1:8002:8002"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_catalog
    secrets: [database_catalog, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  validation:
    <<: *service
    command: ["uvicorn", "services.validation.app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["127.0.0.1:8003:8003"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_validation
    secrets: [database_validation, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gamification:
    <<: *service
    command: ["uvicorn", "services.gamification.app.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports: ["127.0.0.1:8004:8004"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_gamification
    secrets: [database_gamification, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  insights:
    <<: *service
    command: ["uvicorn", "services.insights.app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports: ["127.0.0.1:8005:8005"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_insights
    secrets: [database_insights, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  notifications:
    <<: *service
    command: ["uvicorn", "services.notifications.app.main:app", "--host", "0.0.0.0", "--port", "8006"]
    ports: ["127.0.0.1:8006:8006"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_notifications
    secrets: [database_notifications, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  chatbot:
    <<: *service
    command: ["uvicorn", "services.chatbot.app.main:app", "--host", "0.0.0.0", "--port", "8007"]
    ports: ["127.0.0.1:8007:8007"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_chatbot
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-llama3.1}
    secrets: [database_chatbot, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  kong:
    image: kong:3.9.1@sha256:76c14b93e989f7f4418039f7f9789ca32564016211c86ac1a18022f4788e7b9c
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kong/entrypoint-render.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
      JWT_PUBLIC_KEYS_DIR: /run/public-keys
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports: ["8000:8000"]
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./kong/entrypoint-render.sh:/kong/entrypoint-render.sh:ro
      - ${SECRETS_DIR:-./secrets}/public:/run/public-keys:ro
    depends_on:
      auth: {condition: service_healthy}
      catalog: {condition: service_healthy}
      validation: {condition: service_healthy}
      gamification: {condition: service_healthy}
      insights: {condition: service_healthy}
      notifications: {condition: service_healthy}
      chatbot: {condition: service_healthy}

volumes:
  pgdata:
  rabbitmqdata:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres-password
  rabbit_password:
    file: ${SECRETS_DIR:-./secrets}/rabbit-password
  rabbit_url:
    file: ${SECRETS_DIR:-./secrets}/rabbit-url
  database_template:
    file: ${SECRETS_DIR:-./secrets}/database-template
  admin_password:
    file: ${SECRETS_DIR:-./secrets}/admin-password
  jwt_private:
    file: ${SECRETS_DIR:-./secrets}/jwt-private.key
  pii:
    file: ${SECRETS_DIR:-./secrets}/pii.key
  pii_hmac:
    file: ${SECRETS_DIR:-./secrets}/pii-hmac.key
  database_auth:
    file: ${SECRETS_DIR:-./secrets}/database-auth
  database_catalog:
    file: ${SECRETS_DIR:-./secrets}/database-catalog
  database_validation:
    file: ${SECRETS_DIR:-./secrets}/database-validation
  database_gamification:
    file: ${SECRETS_DIR:-./secrets}/database-gamification
  database_insights:
    file: ${SECRETS_DIR:-./secrets}/database-insights
  database_notifications:
    file: ${SECRETS_DIR:-./secrets}/database-notifications
  database_chatbot:
    file: ${SECRETS_DIR:-./secrets}/database-chatbot
